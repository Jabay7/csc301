<script>
// ============================================================== utilities
const $ = s => document.querySelector(s);
const R = n => Math.floor(Math.random() * n);
const pick = a => a[R(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const range = n => [...Array(n).keys()];
const tokens = s => (String(s).toLowerCase().match(/-?[a-z0-9.]+/g) || []);
const distinctNums = (n, lo, hi) => shuffle(range(hi - lo + 1).map(i => i + lo)).slice(0, n);

class Run {
  constructor() { this.frames = []; }
  show(vis, say, line) { this.frames.push({ vis, say, line }); }
  ask(vis, q, answer, o = {}) {
    this.frames.push({ vis, say: o.say || '', line: o.line, ask: { q, answer: String(answer), options: o.options, num: o.num, why: o.why || '' } });
  }
}

// ============================================================== drawing: arrays, chains, lists
function arrHTML(keys, o = {}) {
  const hl = o.hl || {};
  return `<div>${o.label ? `<div class="lbl">${o.label}</div>` : ''}<table class="arr"><tr>${keys.map((_, i) => `<th>${o.base ? i + o.base : i}</th>`).join('')}</tr><tr>${keys.map((k, i) => `<td class="${hl[i] || ''}">${k == null ? '' : esc(k)}</td>`).join('')}</tr></table></div>`;
}
function hcHTML(hc, keys, hlKey) {
  return `<div><div class="lbl">hashCodes</div><table class="mini"><tr><th>key</th>${keys.map(k => `<th>${esc(k)}</th>`).join('')}</tr><tr><th>hashCode</th>${keys.map(k => `<td class="${k === hlKey ? 'new' : ''}">${hc[k]}</td>`).join('')}</tr></table></div>`;
}
function chainsHTML(chains, o = {}) {
  return `<div class="chains">${chains.map((ch, i) => `<div class="r"><div class="ix ${o.list === i ? 'on' : ''}">${i}</div><span class="arrow">→</span>${ch.length ? ch.map(([k, v]) => `<span class="nd ${o.key === k ? (o.upd ? 'upd' : 'new') : ''}"><span>${esc(k)}</span><span>${esc(v)}</span></span>`).join('<span class="arrow">→</span>') + '<span class="arrow">→</span>' : ''}<span class="null">null</span></div>`).join('')}</div>`;
}
function listHTML(list, o = {}) {
  return `<div class="chains"><div class="r"><div class="lbl" style="margin:0">first</div><span class="arrow">→</span>${list.map(([k, v]) => `<span class="nd ${o.key === k ? (o.upd ? 'upd' : 'new') : ''}"><span>${esc(k)}</span><span>${esc(v)}</span></span><span class="arrow">→</span>`).join('')}<span class="null">null</span></div></div>`;
}

// ============================================================== drawing: binary trees (BST / LLRB)
function treeSVG(root, o = {}) {
  const items = []; let i = 0, maxd = 0;
  (function walk(x, d) { if (!x) return; walk(x.left, d + 1); items.push({ x, d, i: i++ }); maxd = Math.max(maxd, d); walk(x.right, d + 1); })(root, 0);
  if (!items.length) return `<div class="null">(empty tree)</div>`;
  const gap = 46, W = Math.max(260, items.length * gap + 30), H = maxd * 64 + 56;
  const pos = new Map(items.map(t => [t.x, [24 + t.i * gap + 8, 28 + t.d * 64]]));
  const hl = o.hl || {};
  let e = '', n = '';
  for (const t of items) {
    const [x, y] = pos.get(t.x);
    for (const c of [t.x.left, t.x.right]) if (c) {
      const [cx, cy] = pos.get(c);
      e += `<line class="edge ${o.llrb && c.red ? 'redl' : ''}" x1="${x}" y1="${y}" x2="${cx}" y2="${cy}"/>`;
    }
  }
  for (const t of items) {
    const [x, y] = pos.get(t.x);
    n += `<circle class="vx ${hl[t.x.key] || ''}" cx="${x}" cy="${y}" r="17"/><text class="t" x="${x}" y="${y + 5}" text-anchor="middle">${esc(t.x.key)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="tree">${e}${n}</svg>`;
}

// ============================================================== drawing: 2-3 trees
function t23SVG(root, o = {}) {
  const BOX = 30; let cursor = 14, maxd = 0; const pos = new Map();
  const w = n => n.keys.length * BOX;
  function place(n, d) {
    maxd = Math.max(maxd, d);
    if (!n.kids.length) { const x = cursor + w(n) / 2; cursor += w(n) + 18; pos.set(n, [x, d]); return x; }
    const xs = n.kids.map(c => place(c, d + 1)); const x = (xs[0] + xs[xs.length - 1]) / 2; pos.set(n, [x, d]); return x;
  }
  place(root, 0);
  const W = Math.max(cursor, 200), H = maxd * 72 + 56, Y = d => 14 + d * 72;
  let e = '', b = '';
  for (const [n, [x, d]] of pos) {
    const left = x - w(n) / 2;
    n.kids.forEach((c, j) => { const [cx, cd] = pos.get(c); e += `<line class="edge" x1="${left + j * BOX}" y1="${Y(d) + 28}" x2="${cx}" y2="${Y(cd)}"/>`; });
    const cls = n.keys.length > 2 ? 'over' : (o.hl && o.hl.has(n) ? 'hl' : (o.path && o.path.has(n) ? 'path' : ''));
    b += `<rect class="box ${cls}" x="${left}" y="${Y(d)}" width="${w(n)}" height="28" rx="6"/>`;
    n.keys.forEach((k, j) => {
      if (j) b += `<line class="sep" x1="${left + j * BOX}" y1="${Y(d)}" x2="${left + j * BOX}" y2="${Y(d) + 28}"/>`;
      b += `<text class="t" x="${left + j * BOX + BOX / 2}" y="${Y(d) + 19}" text-anchor="middle" font-size="14">${k}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="2-3 tree">${e}${b}</svg>`;
}

function dfsPure(g, s) { const marked = new Set(), edgeTo = {}, order = []; (function go(v) { marked.add(v); order.push(v); for (const w of g.adj[v]) if (!marked.has(w)) { edgeTo[w] = v; go(w); } })(s); return { order, edgeTo, marked }; }
